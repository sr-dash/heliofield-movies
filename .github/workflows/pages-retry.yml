# GitHub's own Pages deployment of the `site` branch now and then times out
# while syncing the site's few thousand files ("syncing_files", 10 minutes).
# When it does, run it again, up to two more times; the new images are then
# live without anyone having to notice.
name: Retry Pages deployment

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Run the failed deployment again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh run rerun ${{ github.event.workflow_run.id }} --failed -R ${{ github.repository }}
